        stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="75" cy="155" r="3" fill="#FFFFFF"/>
  <circle cx="135" cy="155" r="3" fill="#FFFFFF"/>
</svg>
