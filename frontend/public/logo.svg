<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0070F3" stroke="#0056D2" stroke-width="3"/>

  <!-- Stack of layers -->
  <rect x="50" y="50" width="100" height="20" rx="4" fill="#FFFFFF" opacity="0.9"/>
  <rect x="50" y="80" width="100" height="20" rx="4" fill="#FFFFFF" opacity="0.7"/>
  <rect x="50" y="110" width="100" height="20" rx="4" fill="#FFFFFF" opacity="0.5"/>

  <!-- Infinity symbol (for "never" overflow) -->
